name: Build CallHider (.deb)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (ldid, dpkg)
        run: |
          set -e
          brew update >/dev/null || true
          brew install ldid dpkg make || brew install ldid dpkg
          echo "ldid: $(command -v ldid)"
          echo "dpkg-deb: $(command -v dpkg-deb)"

      - name: Install Theos (roothide fork)
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --quiet --recursive https://github.com/roothide/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Fetch iOS SDK
        run: |
          set -e
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar -xz
          mkdir -p "$THEOS/sdks"
          cp -a sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/"
          cp -a sdks-master/iPhoneOS15.6.sdk "$THEOS/sdks/" || true
          echo "SDKs installed:"; ls "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk" || { echo "::error::iPhoneOS16.5.sdk missing"; exit 1; }

      - name: Build package
        run: |
          set -o pipefail
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee build.log
          echo "--- packages ---"; ls -l packages

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish build log to ci-logs branch (on failure)
        if: failure()
        run: |
          mkdir -p _cilog
          cp build.log _cilog/last-build.log 2>/dev/null || echo "(no build.log produced)" > _cilog/last-build.log
          tail -c 24000 _cilog/last-build.log > _cilog/tail.log || true
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI Log Bot"
          git checkout -B ci-logs
          git add -f _cilog/last-build.log _cilog/tail.log
          git commit -m "CI build log for ${GITHUB_SHA}" || true
          git push -f origin ci-logs

      - name: Upload .deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CallHider-deb
          path: packages/*.deb

      - name: Attach .deb to Release (on tag)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
