name: Build CallHider (.deb)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (roothide fork)
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --quiet --recursive https://github.com/roothide/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Fetch iOS SDK
        run: |
          set -e
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar -xz
          mkdir -p "$THEOS/sdks"
          # Keep a couple of recent SDKs; TARGET in the Makefile selects 16.5.
          cp -r sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/" 2>/dev/null || true
          cp -r sdks-master/iPhoneOS16.4.sdk "$THEOS/sdks/" 2>/dev/null || true
          ls "$THEOS/sdks"

      - name: Build package
        run: |
          set -e
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -l packages

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallHider-deb
          path: packages/*.deb

      - name: Attach .deb to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
